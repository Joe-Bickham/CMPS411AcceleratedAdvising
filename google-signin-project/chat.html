  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://cpkuxbounjvdaptzurmq.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwa3V4Ym91bmp2ZGFwdHp1cm1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI0NTAzNjMsImV4cCI6MjA3ODAyNjM2M30.SDH0n2T5-3LATftVndaeS_4PG6kBHVwOYVqXD55hzv8',
      {
        auth: {
          storage: window.sessionStorage,
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
        },
      }
    );

    let user = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const welcome = document.getElementById('welcome-msg');
      const btn = document.getElementById('signout');

      const renderUser = (u) => {
        if (welcome) welcome.textContent = u ? `Welcome, ${u.email || 'student'}` : 'Not signed in';
        if (btn) {
          btn.textContent = u ? 'Sign Out' : 'Sign In';
          btn.disabled = false;
        }
      };

      // initial session check
      try {
        const { data: { session } } = await supabase.auth.getSession();
        user = session?.user || null;
        renderUser(user);
      } catch {
        renderUser(null);
      }

      // keep in sync with auth events (includes INITIAL_SESSION on first load)
      supabase.auth.onAuthStateChange((_event, session) => {
        user = session?.user || null;
        renderUser(user);
      });

      if (btn) btn.addEventListener('click', async (e) => {
        e.preventDefault();
        try{
          localStorage.removeItem('aa_user');
          localStorage.removeItem('aa_program');
          localStorage.removeItem('aa_department');
        }catch{}
        if (user) {
          await supabase.auth.signOut();
        }
        window.location.href = 'index.html';
      });

      // if no session after a short delay, send back to welcome
      setTimeout(() => {
        if (!user) window.location.replace('index.html');
      }, 1500);
    });
  </script>

<body>

    <div class="user-controls">

  <div class="wrap">
    <div class="app">
      <div class="grid">
        <!-- Chat Panel -->
        <section class="panel">

                  <div>
                    <label for="act-english" style="font-size:12px; margin-bottom:2px;">English</label>
                    <input type="number" id="act-english" class="form-input" placeholder="English" min="1" max="36">

                    <input type="number" id="act-reading" class="form-input" placeholder="Reading" min="1" max="36">
                  </div>

                    <label for="act-math" style="font-size:12px; margin-bottom:2px;">Mathematics</label>
                    <input type="number" id="act-math" class="form-input" placeholder="Math" min="1" max="36">

                  <div>

  <script>
    (function(){
      let MODEL = { program:null, courses:[], groups:[] };
      let currentCurriculum = '';
      let conversationHistory = [];
      let awaitingCurriculum = true;
      let studentInfo = {
        isHonors: false,
        actScores: {},
        transferCredits: '',
        dualEnrollment: '',
        analyzed: false
      };
      
      const $ = q => document.querySelector(q);
      const chat = $('#chat');
      const input = $('#input');
      const send = $('#send');
      const progPill = $('#prog-pill');

      function addMsg(text, me=false){
        const div = document.createElement('div');
        div.className = `msg${me?' me':''}`;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      async function loadCurriculum(curriculum) {
        try {
          // Clean up the curriculum name - remove degree types and extra words
          let cleanName = curriculum
            .toLowerCase()
            .replace(/\s+(bs|ba|ms|ma|phd|degree|program)$/i, '') // Remove degree suffixes
            .replace(/\s+concentration$/i, '') // Remove "concentration"
            .replace(/\s+track$/i, '') // Remove "track"
            .trim();
          
          console.log(`[loadCurriculum] Original: "${curriculum}", Cleaned: "${cleanName}"`);
          
          const response = await fetch(`/api/catalog/${encodeURIComponent(cleanName)}`);
          const data = await response.json();
          
          if (!response.ok) {
            return {
              success: false,
              error: data.message || data.error || 'Curriculum not found',
              curriculum: curriculum
            };
          }
          
          MODEL = data;
          currentCurriculum = cleanName;
          awaitingCurriculum = false;
          
          progPill.textContent = `${data.program?.name || curriculum} • ${data.program?.catalog_year || 'Current'}`;
          
          // Update program info in sidebar
          const programInfo = $('#program-info');
          if (programInfo && data.program) {
            programInfo.innerHTML = `
              <strong>${data.program.name || curriculum}</strong><br>
              Catalog Year: ${data.program.catalog_year || 'Current'}<br>
              Total Hours: ${data.program.total_hours || 120}<br>
              Min Grade (Major): ${data.program.min_grade_major || 'C'}<br>
              Courses Available: ${data.courses?.length || 0}
            `;
          }
          
          return {
            success: true,
            data: data,
            curriculum: curriculum,
            programName: data.program?.name || curriculum,
            courseCount: data.courses?.length || 0,
            source: data.source === 'web' ? 'university website' : 'catalog database'
          };
        } catch (error) {
          console.error('Failed to load curriculum:', error);
          return {
            success: false,
            error: error.message || 'Failed to load curriculum',
            curriculum: curriculum
          };
        }
      }

      async function queryClaudeAI(question, systemContext = null) {
        try {
          console.log('[queryClaudeAI] Starting request with question:', question);
          addMsg('🤖 Thinking...', false);
          
          let finalQuestion = question;
          if (systemContext) {
            finalQuestion = `[SYSTEM CONTEXT: ${systemContext}]\n\n${question}`;
          }
          
          // Add student info context if analyzed
          if (studentInfo.analyzed) {
            const studentContext = buildStudentContext();
            finalQuestion = `[STUDENT INFORMATION: ${studentContext}]\n\n${finalQuestion}`;
          }
          
          console.log('[queryClaudeAI] Sending request to /api/claude/advice');
          const response = await fetch('/api/claude/advice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              question: finalQuestion,
              courseData: MODEL,
              completedCourses: [],
              conversationHistory: conversationHistory
            })
          });
          
          console.log('[queryClaudeAI] Response status:', response.status);
          const data = await response.json();
          console.log('[queryClaudeAI] Response data:', data);
          
          const lastMsg = chat.lastChild;
          if (lastMsg && lastMsg.textContent.includes('Thinking')) {
            chat.removeChild(lastMsg);
          }
          
          if (data.success) {
            conversationHistory.push({ role: 'user', content: question });
            conversationHistory.push({ role: 'assistant', content: data.advice });
            
            if (conversationHistory.length > 20) {
              conversationHistory = conversationHistory.slice(-20);
            }
            
            return { type: 'claude', text: data.advice };
          }
          throw new Error(data.error || 'Unknown error');
        } catch (error) {
          console.error('[queryClaudeAI] Error:', error);
          const lastMsg = chat.lastChild;
          if (lastMsg && lastMsg.textContent.includes('Thinking')) {
            chat.removeChild(lastMsg);
          }
          return { type: 'error', text: `Error: ${error.message}. Please check the console for details.` };
        }
      }

      function buildStudentContext() {
        let context = [];
        
        if (studentInfo.isHonors) {
          context.push('Student is in the Honors Program');
        }
        
        if (Object.keys(studentInfo.actScores).length > 0) {
          const scores = Object.entries(studentInfo.actScores)
            .map(([subject, score]) => `${subject}: ${score}`)
            .join(', ');
          context.push(`ACT Scores: ${scores}`);
        }
        
        if (studentInfo.transferCredits) {
          context.push(`Transfer Credits: ${studentInfo.transferCredits}`);
        }
        
        if (studentInfo.dualEnrollment) {
          context.push(`Dual Enrollment: ${studentInfo.dualEnrollment}`);
        }
        
        return context.join(' | ');
      }

      async function submit(){
        try {
          const text = (input.value||'').trim();
          if (!text) return;
          
          console.log('[submit] User input:', text);
          addMsg(text, true);
          input.value = '';
          input.disabled = true;
          send.disabled = true;
          
          if (awaitingCurriculum) {
            console.log('[submit] Awaiting curriculum, checking message type');
            
            // Check if this is a question (contains question words or ends with ?)
            const isQuestion = /\?|what|how|when|where|why|which|can|should|do|does|is|are/i.test(text);
            
            // Check if it's a simple greeting
            const isGreeting = /^(hi|hey|hello|sup|yo|greetings)$/i.test(text.trim());
            
            // Check if it looks like a curriculum name (simple noun phrase, no question words)
            const looksLikeCurriculum = !isQuestion && !isGreeting && text.length > 3;
            
            if (isQuestion) {
              console.log('[submit] Treating as general question');
              // It's a question - let AI answer it and remind about curriculum selection
              const systemContext = 'The user asked a question but hasn\'t selected a curriculum yet. Answer their question helpfully, then remind them they can select a specific curriculum for more detailed advising. Be conversational and helpful.';
              const aiResponse = await queryClaudeAI(text, systemContext);
              if (aiResponse.type === 'claude') {
                addMsg(`🤖 ${aiResponse.text}`, false);
              } else if (aiResponse.type === 'error') {
                addMsg(aiResponse.text, false);
              }
            } else if (looksLikeCurriculum) {
              console.log('[submit] Treating as curriculum name');
              // Try to load as curriculum
              const result = await loadCurriculum(text.toLowerCase());
              
              if (result.success) {
                console.log('[submit] Curriculum loaded successfully, MODEL updated');
                console.log('[submit] MODEL now has', MODEL.courses?.length, 'courses');
                // Curriculum loaded successfully - just confirm to user
                const confirmMsg = `Great! I've loaded the ${result.programName} curriculum with ${result.courseCount} courses. How can I help you with your academic planning?`;
                addMsg(`🤖 ${confirmMsg}`, false);
              } else {
                console.log('[submit] Curriculum load failed');
                // Failed to load - let AI handle it
                const systemContext = `The user said "${text}" which I tried to load as a curriculum but it wasn't found. Error: ${result.error}. Please respond naturally - if it seems like they were asking a question, answer it. Otherwise, ask them to specify a curriculum name.`;
                const aiResponse = await queryClaudeAI(text, systemContext);
                if (aiResponse.type === 'claude') {
                  addMsg(`🤖 ${aiResponse.text}`, false);
                } else if (aiResponse.type === 'error') {
                  addMsg(aiResponse.text, false);
                }
              }
            } else {
              console.log('[submit] Treating as greeting or general message');
              // It's a greeting or general message
              const systemContext = 'The user is greeting you or making a general statement. Please respond naturally as an AI academic advisor for Southeastern Louisiana University and ask which curriculum/degree program they would like to explore. Be friendly and conversational.';
              const aiResponse = await queryClaudeAI(text, systemContext);
              if (aiResponse.type === 'claude') {
                addMsg(`🤖 ${aiResponse.text}`, false);
              } else if (aiResponse.type === 'error') {
                addMsg(aiResponse.text, false);
              }
            }
          } else {
            console.log('[submit] Normal query mode');
            const response = await queryClaudeAI(text);
            if (response.type === 'claude') {
              addMsg(`🤖 ${response.text}`, false);
            } else {
              addMsg(response.text, false);
            }
          }
          
          input.disabled = false;
          send.disabled = false;
          input.focus();
        } catch (error) {
          console.error('[submit] Unexpected error:', error);
          addMsg(`Error: ${error.message}`, false);
          input.disabled = false;
          send.disabled = false;
        }
      }

      send.addEventListener('click', submit);
      input.addEventListener('keydown', e => { if(e.key==='Enter') submit(); });
      
      // Student Information Features
      const analyzeBtn = $('#analyze-credits');
      const downloadBtn = $('#download-info');
      const analysisResult = $('#credit-analysis');
      
      analyzeBtn.addEventListener('click', async () => {
        const isHonors = $('#honors-student').checked;
        const actEnglish = $('#act-english').value.trim();
        const actReading = $('#act-reading').value.trim();
        const actMath = $('#act-math').value.trim();
        const actScience = $('#act-science').value.trim();
        const transferCredits = $('#transfer-credits').value.trim();
        const dualEnrollment = $('#dual-enrollment').value.trim();
        
        const hasActScores = actEnglish || actReading || actMath || actScience;
        if (!hasActScores && !transferCredits && !dualEnrollment && !isHonors) {
          analysisResult.style.display = 'block';
          analysisResult.textContent = 'Please enter student information to analyze.';
          return;
        }
        
        // Store student info for future AI queries
        studentInfo.isHonors = isHonors;
        studentInfo.actScores = {};
        if (actEnglish) studentInfo.actScores.English = actEnglish;
        if (actReading) studentInfo.actScores.Reading = actReading;
        if (actMath) studentInfo.actScores.Mathematics = actMath;
        if (actScience) studentInfo.actScores.Science = actScience;
        studentInfo.transferCredits = transferCredits;
        studentInfo.dualEnrollment = dualEnrollment;
        studentInfo.analyzed = true;
        
        const actScores = {};
        if (actEnglish) actScores.english = actEnglish;
        if (actReading) actScores.reading = actReading;
        if (actMath) actScores.mathematics = actMath;
        if (actScience) actScores.science = actScience;
        
        try {
          analysisResult.style.display = 'block';
          analysisResult.textContent = '🤖 Analyzing your credits...';
          
          const response = await fetch('/api/claude/credit-analysis', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              actScores: Object.keys(actScores).length > 0 ? actScores : null,
              transferCredits: transferCredits || '',
              dualEnrollmentCredits: dualEnrollment || '',
              courseData: MODEL,
              degreeProgram: currentCurriculum,
              isHonors: isHonors
            })
          });
          
          const data = await response.json();
          if (data.success) {
            analysisResult.textContent = `🤖 Credit Analysis:\n\n${data.analysis}`;
            addMsg('✅ Student information saved! I will now use this information when answering your questions about prerequisites and course requirements.', false);
          } else {
            throw new Error(data.error || 'Analysis failed');
          }
        } catch (error) {
          console.error('Credit analysis error:', error);
          analysisResult.textContent = 'Credit analysis temporarily unavailable.';
        }
      });
      
      downloadBtn.addEventListener('click', () => {
        const isHonors = $('#honors-student').checked;
        const actEnglish = $('#act-english').value.trim();
        const actReading = $('#act-reading').value.trim();
        const actMath = $('#act-math').value.trim();
        const actScience = $('#act-science').value.trim();
        const transferCredits = $('#transfer-credits').value.trim();
        const dualEnrollment = $('#dual-enrollment').value.trim();
        const analysisText = analysisResult.style.display !== 'none' ? analysisResult.textContent : '';
        
        let content = `STUDENT INFORMATION - ${currentCurriculum || 'Academic Advising'}\n`;
        content += '='.repeat(60) + '\n\n';
        content += `Generated: ${new Date().toLocaleString()}\n\n`;
        
        if (isHonors) {
          content += 'HONORS STUDENT: Yes\n\n';
        }
        
        if (actEnglish || actReading || actMath || actScience) {
          content += 'ACT SCORES:\n';
          if (actEnglish) content += `  English: ${actEnglish}\n`;
          if (actReading) content += `  Reading: ${actReading}\n`;
          if (actMath) content += `  Mathematics: ${actMath}\n`;
          if (actScience) content += `  Science: ${actScience}\n`;
          content += '\n';
        }
        
        if (transferCredits) {
          content += `TRANSFER CREDITS:\n${transferCredits}\n\n`;
        }
        
        if (dualEnrollment) {
          content += `DUAL ENROLLMENT CREDITS:\n${dualEnrollment}\n\n`;
        }
        
        if (analysisText && !analysisText.includes('unavailable')) {
          content += `AI ANALYSIS:\n${analysisText}\n\n`;
        }
        
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `student-info-${new Date().toISOString().split('T')[0]}.txt`;
        a.style.display = 'none';
        document.body.appendChild(a);
        
        setTimeout(() => {
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 100);
        }, 10);
      });
      
    })();
  </script>
  <script src="theme-toggle.js" defer></script>
</body>
</html>
