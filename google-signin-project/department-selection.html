<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Department - Accelerated Advising</title>
  <link rel="stylesheet" href="ui-shared.css"/>
  <link rel="stylesheet" href="theme.css"/>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { requireSession } from './auth.js';
    const supabase = createClient(
      'https://cpkuxbounjvdaptzurmq.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwa3V4Ym91bmp2ZGFwdHp1cm1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI0NTAzNjMsImV4cCI6MjA3ODAyNjM2M30.SDH0n2T5-3LATftVndaeS_4PG6kBHVwOYVqXD55hzv8',
      {
        auth: {
          storage: window.sessionStorage,
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
        },
      }
    );
    await requireSession(supabase, 'index.html', 7000);
    window.SUPABASE = supabase;
  </script>
  <style>
    :root { --green:#006747; --emerald:#0c8a63; --gold:#fdb913;
      --ink:#eaf8f5; --muted:rgba(255,255,255,.85);
      --panel:rgba(255,255,255,.06); --panel-b:rgba(255,255,255,.12); }
    body { margin:0; color:var(--ink); font:16px/1.5 system-ui, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 800px at 20% -10%, #0e7a62 0%, transparent 60%),
        radial-gradient(1200px 800px at 80% 10%, #0b493b 0%, transparent 60%),
        linear-gradient(180deg, #0e3a32 0%, #0b2a34 55%, #0a1f2d 100%);
      min-height:100dvh; display:flex; flex-direction:column; }
    .top-bar { display:flex; justify-content:space-between; align-items:center;
      max-width:1100px; width:100%; margin:20px auto; padding:0 20px; }
    .brand{display:flex; align-items:center; gap:12px; font-weight:800; font-size:20px; line-height:1;}
    /* Logo badge like IT page */
    :root{ --logo-size: 75px; --logo-zoom: 150%; --logo-pos-x: 50%; --logo-pos-y: 38%; }
    .logo-wrap{ width:var(--logo-size); height:var(--logo-size); border-radius:10px; overflow:hidden; position:relative; background: linear-gradient(180deg, #0d463b, #082e26); box-shadow: 0 10px 26px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06); }
    .logo-wrap::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); background: linear-gradient(to bottom, rgba(255,255,255,.06), rgba(255,255,255,0) 40%); }
    .logo-bg{ position:absolute; inset:0; background-image:url("./assets/kaizenexus_logo.svg"); background-repeat:no-repeat; background-size: var(--logo-zoom); background-position: var(--logo-pos-x) var(--logo-pos-y); }
    .user-controls {display:flex; align-items:center; gap:12px;}
    .user-meta {opacity:.9; font-size:14px;}
    .signout {background:#d94b4b; color:#fff; border:none; border-radius:10px; padding:8px 12px; font-weight:700; cursor:pointer;}
    .signout:hover {filter:brightness(1.05);}
    .wrap {flex:1; display:flex; justify-content:center; align-items:flex-start; padding:20px;}
    .card { background:var(--panel); border:1px solid var(--panel-b); border-radius:16px;
      box-shadow:0 18px 48px rgba(0,0,0,.35); padding:24px; backdrop-filter: blur(4px); width:100%; max-width:800px; }
    h1 {margin:0 0 6px; font-size:28px; text-align:center;}
    .sub {margin:0 0 20px; color:var(--muted); font-size:14px; text-align:center;}
    .button-list {display:flex; flex-direction:column; gap:16px; width:100%;}
    .dept-btn { display:block; width:100%; text-align:center; font-size:20px; font-weight:800; letter-spacing:.3px;
      color:#072b22; text-decoration:none; background:var(--green);
      border:1px solid rgba(255,255,255,.18); border-radius:10px; padding:18px 20px;
      box-shadow:0 6px 16px rgba(0,0,0,.25), inset 0 -2px 0 rgba(0,0,0,.15);
      transition:transform .08s ease, background .15s ease, border-color .15s ease; cursor:pointer; }
    .dept-btn:hover{ background:var(--emerald); transform:translateY(-2px); border-color:var(--gold); }
    .dept-btn:active{ transform:translateY(0); }
    .pill{ display:inline-block; margin-left:10px; font-size:13px; font-weight:700; color:var(--ink);
      background:#145647; padding:4px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.18);}
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <span class="logo-wrap"><span class="logo-bg" aria-label="KaizeNexus logo"></span></span>
      Accelerated Advising
    </div>
    <div class="user-controls">
      <div class="user-meta" id="user-info">Not signed in</div>
      <button class="signout" id="signout">Sign Out</button>
      <button id="theme-toggle" class="theme-toggle" aria-pressed="true" aria-label="Switch to light mode">🌙</button>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <h1>Select Your Department</h1>
      <p class="sub">Choose a department to view available programs.</p>

      <div class="button-list">
        <button class="dept-btn" data-dept="communication-media">
          Department of Communication & Media Studies <span class="pill">Available</span>
        </button>
        <button class="dept-btn" data-dept="sociology-criminal-justice">
          Department of Sociology & Criminal Justice
        </button>
        <button class="dept-btn" data-dept="computer-science">
          Department of Computer Science <span class="pill">Available</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Display user status if present
    try {
      const rawUser = localStorage.getItem('aa_user');
      if (rawUser) {
        const u = JSON.parse(rawUser);
        document.getElementById('user-info').textContent =
          (u && u.name && u.email) ? `${u.name} (${u.email})` : 'Signed in';
      }
    } catch {}

    // Check for sessionStorage user info (from Google sign-in)
    try {
      const sessionUser = sessionStorage.getItem('userInfo');
      if (sessionUser && !localStorage.getItem('aa_user')) {
        const u = JSON.parse(sessionUser);
        localStorage.setItem('aa_user', JSON.stringify(u));
        document.getElementById('user-info').textContent =
          (u && u.name && u.email) ? `${u.name} (${u.email})` : 'Signed in';
      }
    } catch {}

    // Navigation helper: use relative paths within the same folder
    const DEGREES_PAGE = 'degrees.html';

    function go(relPath){
      const url = new URL(relPath, window.location.href).toString();
      window.location.assign(url);
    }

    // Handle department selection
    document.querySelectorAll('.dept-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const dept = e.target.getAttribute('data-dept');
        
        // Store selected department
        try { 
          localStorage.setItem('aa_department', dept); 
        } catch {}
        
        // Navigate to degrees page
        go(DEGREES_PAGE);
      });
    });

    // Sign out via Supabase and return to index
    document.getElementById('signout').addEventListener('click', async ()=>{
      try{ await (window.SUPABASE?.auth.signOut()); }catch{}
      try{
        localStorage.removeItem('aa_user');
        localStorage.removeItem('aa_program');
        localStorage.removeItem('aa_department');
      }catch{}
      window.location.assign('index.html');
    });
  </script>
  <script src="theme-toggle.js" defer></script>
</body>
</html>
