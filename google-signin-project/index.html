<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign In</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="signin-card">
            <h1>Welcome</h1>
            <p>Please sign in with your Google account to continue</p>
            <div class="manual-signin">
                <button id="supabase-google-btn">Continue with Google</button>
            </div>
            <div class="info" style="margin-top:12px;">
                <p>Secure login via Supabase Auth (Google). After signing in you will be redirected to department selection.</p>
            </div>
        </div>
    </div>
    
    <script type="module" src="script.js"></script>
</body>
</html>
