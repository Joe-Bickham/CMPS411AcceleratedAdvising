<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign In</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <style>
      :root{
        --logo-size: 75px;
        --logo-zoom: 150%;
        --logo-pos-x: 50%;
        --logo-pos-y: 38%;
      }
      .top-bar { display:flex; justify-content:center; margin:28px 0 12px; }
      .brand { display:flex; align-items:center; gap:14px; font-weight:800; font-size:20px; line-height:1; color:#eaf8f5; }
      /* Sleek zoomable badge like IT page */
      .logo-wrap{ width:var(--logo-size); height:var(--logo-size); border-radius:10px; overflow:hidden; position:relative; background: linear-gradient(180deg, #0d463b, #082e26); box-shadow: 0 10px 26px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06); }
      .logo-wrap::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); background: linear-gradient(to bottom, rgba(255,255,255,.06), rgba(255,255,255,0) 40%); }
      .logo-bg{ position:absolute; inset:0; background-image:url("./assets/kaizenexus_logo.svg"); background-repeat:no-repeat; background-size: var(--logo-zoom); background-position: var(--logo-pos-x) var(--logo-pos-y); }
      .brand-title { font-size:20px; letter-spacing:.3px; }
    </style>

    <div class="top-bar">
      <div class="brand">
        <span class="logo-wrap"><span class="logo-bg" aria-label="KaizeNexus logo"></span></span>
        <span class="brand-title">Accelerated Advising</span>
      </div>
      <div class="user-controls">
        <button id="theme-toggle" class="theme-toggle" aria-pressed="true" aria-label="Switch to light mode">🌙</button>
      </div>
    </div>

    <main class="main">
      <div class="container">
          <div class="signin-card">
              <h1>Welcome</h1>
              <p>Please sign in with your Google account to continue</p>
              <div class="manual-signin">
                  <button id="supabase-google-btn">Continue with Google</button>
              </div>
              <div class="info" style="margin-top:12px;">
                  <p>Secure login via Supabase Auth (Google). After signing in you will be redirected to the AI advisor.</p>
              </div>
          </div>
      </div>
    </main>
    
    <script type="module" src="script.js"></script>
    <script src="theme-toggle.js" defer></script>
</body>
</html>
