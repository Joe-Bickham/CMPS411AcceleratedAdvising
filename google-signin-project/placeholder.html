<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Placeholder</title>
    <link rel="stylesheet" href="placeholder-styles.css">
</head>
<body>
    <div class="container">
        <div class="placeholder-card">
            <div class="user-info" id="user-info">
                <!-- User info will be populated by JavaScript -->
            </div>
            
            <h1>Placeholder Page</h1>
            <p>Welcome! You have successfully signed in with your Google account.</p>
            <p>This is a placeholder page where your main application content would go.</p>
            
            <div class="actions">
                <button onclick="signOut()" class="sign-out-btn">Sign Out</button>
            </div>
        </div>
    </div>
    
    <script src="placeholder-script.js"></script>
</body>
</html>
